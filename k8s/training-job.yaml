apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-checkpoints-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-training-job
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ml-training
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "src/train.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: training-data
              mountPath: /app/data
            - name: training-checkpoints
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: training-checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints-pvc
